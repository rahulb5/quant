experiment_id: EXP-0001
hypothesis: Extreme commercial (producer/merchant) net positioning in CFTC disaggregated
  futures, expressed as a 52-week rolling percentile rank of net_long contracts, predicts
  positive forward commodity returns over the following week (via weekly rebalance).
  This is the headline variant the research notebook's OOS section centers on (raw_pctile_52w
  >= 90), not a Sharpe-optimized choice -- see src/signals/cot_commercial_positioning.py's
  own docstring caveat.
data:
  asset_class: commodity
  resample: W-MON
  start: null
  end: null
signal:
  module: src.signals.cot_commercial_positioning
  parameters: {}
portfolio:
  rule: equal_weight_long_threshold
  date_column: week_date
  asset_column: commodity
  signal_column: raw_pctile_52w
  threshold: 90.0
  trend_filter: trend_none
  n_deciles: 10
  min_names: 50
researcher: rhlbh
created_at: '2026-10-04'
backtest:
  cost_bps: 1.0
  lag: 1
  periods_per_year: 52
validation:
  methodology: ''
  holdout_start: null
  n_trials: 96
  family: cot_commercial_positioning
  family_version: v1

robustness:
  cost_multipliers:
  - 0.5
  - 1.0
  - 1.5
  - 2.0
  - 3.0
  - 5.0
  lag_offsets:
  - 0
  - 1
  - 2
  param_grid:
    portfolio.signal_column:
    - raw_pctile_26w
    - raw_pctile_52w
    - raw_pctile_78w
    portfolio.threshold:
    - 80
    - 85
    - 90
    - 95
  crisis_windows:
    gfc_2008:
    - '2008-01-01'
    - '2009-06-30'
    covid_2020:
    - '2020-02-01'
    - '2020-06-30'
    inflation_2022:
    - '2022-01-01'
    - '2022-12-31'
  n_boot: 2000
  seed: 0
  cost_kill_multiplier: 1.5
  cost_flag_multiplier: 2.0
  breakeven_flag_bps: 5.0
  lag_kill_retention: 0.35
  lag_flag_retention: 0.5
  outlier_trim_frac: 0.01
  positive_year_flag_frac: 0.55
  half_sharpe_flag: -0.2
  param_kill_frac: 0.6
  deflated_sharpe_flag: 0.9
  holdout_kill_sharpe: -0.25
status: complete
conclusion: null
git_sha: null
data_as_of: null
classification:
  asset_class: commodities
  universe: cot_11_futures
  signal_family: positioning
  frequency: weekly
  direction: long_only
