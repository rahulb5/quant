experiment_id: EXP-0002
hypothesis: Formulaic alpha_19 (Kakushadze & Tulchinsky, 2015) -- fading a stock's
  7-day price move, scaled by its cross-sectional rank of 250-day momentum -- predicts
  next-day cross-sectional relative returns on the current S&P 500 universe, traded
  as a daily-rebalanced decile long/short dollar-neutral portfolio. This was the standout
  of a 10-alpha screen in notebooks/signals/formulaic_alphas_batch1.ipynb (highest
  Sharpe, lowest turnover of the batch) -- see src/signals/formulaic_alpha_19.py's
  docstring for the survivorship-bias caveat (current constituents only, no point-in-time
  index membership).
data:
  asset_class: equity
  resample: null
  start: null
  end: null
signal:
  module: src.signals.formulaic_alpha_19
  parameters: {}
portfolio:
  rule: decile_long_short
  date_column: d
  asset_column: ticker
  signal_column: alpha_19
  threshold: 0.0
  trend_filter: trend_none
  n_deciles: 10
  min_names: 200
researcher: rhlbh
created_at: '2026-10-11'
backtest:
  cost_bps: 1.0
  lag: 1
  periods_per_year: 252
validation:
  methodology: ''
  holdout_start: null
  n_trials: 10
robustness:
  cost_multipliers:
  - 0.5
  - 1.0
  - 1.5
  - 2.0
  - 3.0
  - 5.0
  lag_offsets:
  - 0
  - 1
  - 2
  param_grid:
    signal.parameters.trend_window:
    - 5
    - 7
    - 10
    signal.parameters.momentum_window:
    - 200
    - 250
    - 300
  crisis_windows:
    gfc_2008:
    - '2008-01-01'
    - '2009-06-30'
    covid_2020:
    - '2020-02-01'
    - '2020-06-30'
    inflation_2022:
    - '2022-01-01'
    - '2022-12-31'
  n_boot: 2000
  seed: 0
  cost_kill_multiplier: 1.5
  cost_flag_multiplier: 2.0
  breakeven_flag_bps: 5.0
  lag_kill_retention: 0.35
  lag_flag_retention: 0.5
  outlier_trim_frac: 0.01
  positive_year_flag_frac: 0.55
  half_sharpe_flag: -0.2
